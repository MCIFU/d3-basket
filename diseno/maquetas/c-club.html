<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C · Club</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
:root {
  --bg: #eef0f3; --card: #fff; --card2: #f5f6f8; --line: #e3e6eb; --tx: #0f1216; --tx2: #535b67; --tx3: #8b929d;
  --win: #14935a; --loss: #d6413f;
  --r-top: #2563eb; --r-good: #16a34a; --r-ok: #84cc16; --r-mid: #eab308; --r-low: #f97316; --r-bad: #dc2626;
  --cond: 'Barlow Condensed', 'Arial Narrow', sans-serif; --sans: 'Inter', system-ui, sans-serif;
}
:root[data-theme="dark"] { --bg: #0a0c0f; --card: #13161b; --card2: #1a1e24; --line: #232831; --tx: #f0f2f5; --tx2: #a5adb9; --tx3: #6c7380; --win: #34c77b; --loss: #ff6b69; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0a0c0f; --card: #13161b; --card2: #1a1e24; --line: #232831; --tx: #f0f2f5; --tx2: #a5adb9; --tx3: #6c7380; --win: #34c77b; --loss: #ff6b69; }
}
* { box-sizing: border-box; margin: 0; }
body { background: var(--bg); color: var(--tx); font: 14.5px/1.45 var(--sans); font-feature-settings: 'tnum' 1; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 32px; }
/* Cabecera sobre la portada */
.top { position: absolute; inset: 0 0 auto; z-index: 4; color: #fff; }
.top .wrap { display: flex; align-items: center; height: 68px; gap: 30px; }
.brand { font: 800 28px/1 var(--cond); letter-spacing: .01em; text-transform: uppercase; }
.brand span { opacity: .6; }
nav.main { display: flex; gap: 24px; font: 600 15px var(--cond); letter-spacing: .06em; text-transform: uppercase; }
nav.main a { opacity: .75; } nav.main a.on { opacity: 1; box-shadow: 0 2px 0 #fff; padding-bottom: 4px; }
.tools { margin-left: auto; display: flex; gap: 8px; }
.ib { height: 38px; min-width: 38px; border-radius: 999px; border: 1px solid rgb(255 255 255 / .3); background: rgb(255 255 255 / .1); color: #fff; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 12px; font: 500 13px var(--sans); backdrop-filter: blur(8px); }
.ib kbd { font: 600 11px var(--sans); opacity: .7; }
.burger { display: none; }
/* Portada */
.hero { position: relative; overflow: hidden; color: #fff; background: radial-gradient(120% 140% at 85% 20%, color-mix(in oklab, var(--c1) 85%, white) 0%, var(--c1) 28%, var(--c2) 62%, color-mix(in oklab, var(--c2) 55%, black) 100%); }
.hero::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(-58deg, rgb(255 255 255 / .06) 0 3px, transparent 3px 34px); }
.hero .ghost { position: absolute; right: -10px; bottom: -70px; font: 800 380px/1 var(--cond); letter-spacing: -.02em; color: rgb(255 255 255 / .08); text-transform: uppercase; white-space: nowrap; }
.hero .wrap { position: relative; display: grid; grid-template-columns: 1fr 470px; min-height: 520px; padding-top: 68px; }
.hero .txt { align-self: center; padding-bottom: 70px; }
.league { display: inline-flex; align-items: center; gap: 10px; font: 600 14px var(--cond); letter-spacing: .12em; text-transform: uppercase; background: rgb(0 0 0 / .18); padding: 6px 14px 6px 6px; border-radius: 999px; }
.league img { width: 26px; height: 26px; object-fit: contain; background: #fff; border-radius: 50%; padding: 3px; }
h1 { font: 800 112px/.86 var(--cond); text-transform: uppercase; letter-spacing: -.005em; margin: 22px 0 22px; text-shadow: 0 4px 30px rgb(0 0 0 / .15); }
h1 small { display: block; font-size: 46px; font-weight: 600; opacity: .85; letter-spacing: .02em; }
.meta { display: flex; gap: 0; font-size: 14px; }
.meta div { padding: 0 22px; border-left: 1px solid rgb(255 255 255 / .28); }
.meta div:first-child { padding-left: 0; border: 0; }
.meta dt { font: 600 12.5px var(--cond); letter-spacing: .12em; text-transform: uppercase; opacity: .7; }
.meta dd { font: 700 22px/1.2 var(--cond); letter-spacing: .02em; }
.team { display: flex; align-items: center; gap: 12px; margin-top: 26px; font: 700 20px var(--cond); text-transform: uppercase; letter-spacing: .04em; }
.team img { width: 44px; height: 44px; object-fit: contain; background: #fff; border-radius: 12px; padding: 5px; }
.body { position: relative; display: flex; align-items: flex-end; justify-content: center; }
.body img { max-height: 500px; max-width: 100%; object-fit: contain; filter: drop-shadow(0 20px 40px rgb(0 0 0 / .35)); }
.num { position: absolute; left: 10px; top: 120px; font: 800 120px/1 var(--cond); color: transparent; -webkit-text-stroke: 2px rgb(255 255 255 / .5); }
/* Franja de medias */
.strip { position: relative; z-index: 2; margin-top: -54px; background: var(--card); border-radius: 16px; display: grid; grid-template-columns: repeat(5, 1fr) 1.2fr; box-shadow: 0 20px 50px rgb(0 0 0 / .12); overflow: hidden; }
.strip > div { padding: 20px 24px; border-right: 1px solid var(--line); }
.strip > div:last-child { border: 0; background: var(--card2); }
.strip .v { font: 700 54px/1 var(--cond); letter-spacing: -.01em; }
.strip .k { font: 600 13px var(--cond); letter-spacing: .12em; text-transform: uppercase; color: var(--tx2); margin-top: 4px; }
.strip .bar { height: 4px; border-radius: 2px; background: var(--card2); margin-top: 12px; overflow: hidden; }
.strip .bar i { display: block; height: 100%; background: var(--c2); }
.strip .rec { display: grid; align-content: center; gap: 4px; }
.strip .rec b { font: 700 30px/1 var(--cond); }
.strip .rec span { color: var(--tx2); font-size: 13px; }
/* Bloques */
.g { display: grid; grid-template-columns: 380px 1fr; gap: 20px; margin-top: 28px; }
.card { background: var(--card); border-radius: 16px; padding: 22px; border: 1px solid var(--line); min-width: 0; }
h2 { font: 700 24px/1 var(--cond); text-transform: uppercase; letter-spacing: .04em; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
h2 small { font: 500 12.5px var(--sans); color: var(--tx3); text-transform: none; letter-spacing: 0; }
h2::before { content: ''; width: 5px; height: 20px; background: var(--c2); border-radius: 2px; align-self: center; margin-right: -2px; }
h2 > span { margin-right: auto; }
.radar { width: 100%; max-width: 330px; display: block; margin: 0 auto; }
.radar .ring { fill: none; stroke: var(--line); } .radar .spoke { stroke: var(--line); }
.radar .rl { fill: var(--tx2); font: 600 12.5px var(--cond); letter-spacing: .06em; text-transform: uppercase; } .radar .rv { fill: var(--tx); font: 700 13px var(--sans); }
.plist { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; margin-top: 16px; font-size: 13px; }
.plist div { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--line); padding: 5px 0; color: var(--tx2); }
.plist b { color: var(--tx); }
.chart { width: 100%; height: auto; display: block; color: var(--tx); }
.chart .grid { stroke: var(--line); } .chart .tick, .chart .sub { fill: var(--tx3); font: 11px var(--sans); }
.chart .lab { fill: var(--tx2); font: 700 13px var(--cond); letter-spacing: .05em; } .chart .val { fill: var(--tx); font: 700 15px var(--cond); }
.chart .avg { stroke-dasharray: 5 5; stroke-width: 2; } .chart .avgt { fill: var(--tx2); font: 700 14px var(--cond); letter-spacing: .04em; text-transform: uppercase; }
.shots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 20px; }
.shot { background: var(--card2); border-radius: 12px; padding: 14px 16px; }
.shot .k { font: 600 13px var(--cond); letter-spacing: .1em; text-transform: uppercase; color: var(--tx2); }
.shot .v { font: 700 36px/1.05 var(--cond); }
.shot .m { font-size: 12.5px; color: var(--tx3); }
.shot .bar { height: 6px; border-radius: 3px; background: var(--line); margin-top: 10px; overflow: hidden; } .shot .bar i { display: block; height: 100%; background: var(--c2); }
/* Partidos como tarjetas */
.games { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.gm { background: var(--card2); border-radius: 14px; padding: 14px; position: relative; overflow: hidden; }
.gm .hd { display: flex; align-items: center; gap: 10px; }
.gm .hd img { width: 34px; height: 34px; object-fit: contain; }
.gm .op { font: 700 16px/1.1 var(--cond); text-transform: uppercase; letter-spacing: .03em; }
.gm .dt { font-size: 12px; color: var(--tx3); }
.gm .rs { position: absolute; right: 12px; top: 12px; font: 700 13px var(--cond); letter-spacing: .06em; padding: 3px 8px; border-radius: 6px; color: #fff; }
.gm .ln { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 14px; text-align: center; }
.gm .ln b { display: block; font: 700 26px/1 var(--cond); }
.gm .ln span { font: 600 11.5px var(--cond); letter-spacing: .1em; color: var(--tx3); }
.gm .ln .val b { color: var(--vc); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { font: 600 13px var(--cond); letter-spacing: .1em; text-transform: uppercase; color: var(--tx3); text-align: right; padding: 0 10px 10px; }
td { text-align: right; padding: 12px 10px; border-top: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child, .tl { text-align: left; }
tr.cur td { background: color-mix(in oklab, var(--c1) 14%, transparent); font-weight: 700; }
.lgp { display: inline-block; font: 700 12px var(--cond); letter-spacing: .08em; padding: 2px 7px; border-radius: 5px; background: var(--card2); }
.recs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.recs div { border-left: 3px solid var(--c2); padding: 4px 0 4px 14px; }
.recs b { font: 700 34px/1 var(--cond); display: block; } .recs span { font: 600 13px var(--cond); letter-spacing: .1em; text-transform: uppercase; color: var(--tx2); } .recs small { display: block; color: var(--tx3); font-size: 12px; margin-top: 2px; }
.mt { margin-top: 20px; }
footer { color: var(--tx3); font-size: 12.5px; padding: 30px 0 50px; }
/* Móvil */
@media (max-width: 760px) {
  .wrap { padding: 0 16px; }
  .top .wrap { height: 58px; gap: 10px; }
  nav.main, .ib kbd, .ib span { display: none; }
  .burger { display: flex; }
  .brand { font-size: 23px; }
  .hero .wrap { grid-template-columns: 1fr; min-height: 0; padding-top: 58px; }
  .hero .ghost { font-size: 180px; bottom: auto; top: 70px; }
  .body { order: -1; height: 300px; margin-top: 4px; }
  .body img { max-height: 300px; }
  .num { font-size: 70px; top: 30px; left: 0; }
  .hero .txt { padding-bottom: 76px; }
  h1 { font-size: 68px; margin: 16px 0; } h1 small { font-size: 30px; }
  .meta { flex-wrap: wrap; row-gap: 12px; }
  .meta div { padding: 0 14px; } .meta div:nth-child(3) { border: 0; padding-left: 0; }
  .meta dd { font-size: 19px; }
  .strip { grid-template-columns: repeat(3, 1fr); margin-top: -50px; }
  .strip > div { padding: 14px; }
  .strip > div:nth-child(3) { border-right: 0; }
  .strip > div:nth-child(n+4) { border-top: 1px solid var(--line); }
  .strip .v { font-size: 40px; }
  .strip .rec { grid-column: span 2; }
  .g { grid-template-columns: 1fr; gap: 14px; margin-top: 16px; }
  .card { padding: 16px; border-radius: 14px; }
  .games { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 78%; overflow-x: auto; scroll-snap-type: x mandatory; }
  .gm { scroll-snap-align: start; }
  .shots { gap: 8px; } .shot { padding: 12px; } .shot .v { font-size: 30px; }
  .recs { grid-template-columns: 1fr 1fr; row-gap: 16px; }
  .hm { display: none; }
  .scroll { overflow-x: auto; }
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <button class="ib burger" aria-label="Menú"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.6"/></svg></button>
  <div class="brand">d3 <span>basket</span></div>
  <nav class="main"><a>Hoy</a><a>Competiciones</a><a>Equipos</a><a class="on">Jugadores</a><a>Explorar</a><a>Españoles</a></nav>
  <div class="tools"><button class="ib"><svg width="15" height="15" viewBox="0 0 16 16"><circle cx="7" cy="7" r="5" stroke="currentColor" fill="none" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6"/></svg><span>Buscar</span><kbd>Ctrl K</kbd></button><button class="ib" onclick="toggleTheme()" aria-label="Tema"><svg width="15" height="15" viewBox="0 0 16 16"><path d="M8 1.5a6.5 6.5 0 1 0 0 13z" fill="currentColor"/><circle cx="8" cy="8" r="6.5" stroke="currentColor" fill="none" stroke-width="1.3"/></svg></button></div>
</div></header>
<div id="app"></div>
<script src="assets/data.js"></script>
<script src="assets/common.js"></script>
<script>
const T = P.team, a = P.avg
const st = document.documentElement.style
const [dk, lt] = clubColors(T); st.setProperty('--c1', lt); st.setProperty('--c2', dk)
const [first, ...rest] = P.name.split(' ')
const pct = (k) => P.pcts.find((x) => x.k === k)?.pct ?? 0
const strip = [['Puntos', a.pts, 'pts'], ['Rebotes', a.reb, 'reb'], ['Asistencias', a.ast, 'ast'], [valLabel() === 'VAL' ? 'Valoración' : 'Valoración*', a.val, P.pcts.some((x) => x.k === 'pir') ? 'pir' : null], ['Minutos', a.min, null]]
const wins = P.games.filter((g) => g.win).length
app.innerHTML = `
<section class="hero">
  <div class="ghost">${P.last}</div>
  <div class="wrap">
    <div class="txt">
      <span class="league"><img src="${P.leagueLogo}" alt="">${P.league} · ${P.season}</span>
      <h1><small>${first}</small>${rest.join(' ')}</h1>
      <dl class="meta">
        <div><dt>Posición</dt><dd>${P.pos}</dd></div>
        <div><dt>Edad</dt><dd>${P.age} años</dd></div>
        <div><dt>Altura</dt><dd>${P.height}</dd></div>
        <div><dt>Nacionalidad</dt><dd>${P.flag} ${P.nat}</dd></div>
      </dl>
      <div class="team"><img src="${T.logo}" alt="">${T.name}</div>
    </div>
    <div class="body">${P.number ? `<div class="num">#${P.number}</div>` : ''}<img src="${P.body}" alt=""></div>
  </div>
</section>
<main class="wrap">
  <section class="strip">
    ${strip.map(([k, v, pk]) => `<div><div class="v">${n1(v)}</div><div class="k">${k}</div>${pk ? `<div class="bar"><i style="width:${pct(pk)}%"></i></div>` : ''}</div>`).join('')}
    <div class="rec"><b>${a.gp} partidos</b><span>${wins} victorias y ${a.gp - wins} derrotas de su equipo · medias por partido</span></div>
  </section>
  <div class="g">
    <section class="card"><h2><span>Perfil</span><small>percentil en la liga</small></h2>
      ${radar(P.pcts.filter((x) => x.k !== 'tov').map((x) => ({ ...x, short: SHORT[x.k] })), dk, 320)}
      <div class="plist">${P.pcts.map((x) => `<div><span>${SHORT[x.k]}</span><b>${fmtPct(x)}</b></div>`).join('')}</div>
    </section>
    <section class="card"><h2><span>Partido a partido</span><small>puntos · media en línea discontinua</small></h2>
      ${gameChart(P.games, { bar: (g) => (g.win ? dk : 'color-mix(in oklab, ' + dk + ' 35%, var(--card2))'), avgColor: 'var(--tx)', h: 260, w: innerWidth < 760 ? 520 : 760, rx: 5 })}
      <div class="shots">${P.shooting.map(([k, m, at]) => `<div class="shot"><div class="k">${k === 'T2' ? 'Tiros de 2' : k === 'T3' ? 'Triples' : 'Libres'}</div><div class="v">${pctShot(m, at)}%</div><div class="m">${m} de ${at}</div><div class="bar"><i style="width:${pctShot(m, at)}%"></i></div></div>`).join('')}</div>
    </section>
  </div>
  <section class="card mt"><h2><span>Últimos partidos</span><small>${P.league} ${P.season}</small></h2>
    <div class="games">${P.games.slice(0, 4).map((g) => `<div class="gm" style="--vc:${valColor(g.val)}"><div class="hd"><img src="${g.oppLogo}" alt=""><div><div class="op">${g.home ? '' : '@ '}${g.oppAbbr}</div><div class="dt">${fecha(g.date)} · ${g.score}</div></div></div><span class="rs" style="background:${g.win ? 'var(--win)' : 'var(--loss)'}">${g.win ? 'VICTORIA' : 'DERROTA'}</span><div class="ln"><div><b>${g.pts}</b><span>PTS</span></div><div><b>${g.reb}</b><span>REB</span></div><div><b>${g.ast}</b><span>AST</span></div><div class="val"><b>${g.val}</b><span>${valLabel()}</span></div></div></div>`).join('')}</div>
  </section>
  ${P.records ? `<section class="card mt"><h2><span>Récords en la ACB</span><small>mejor marca en un partido</small></h2><div class="recs">${P.records.map(([k, v, d]) => `<div><b>${v}</b><span>${k}</span><small>${d}</small></div>`).join('')}</div></section>` : ''}
  <section class="card mt"><h2><span>Trayectoria</span><small>medias por temporada</small></h2>
    <div class="scroll"><table><thead><tr><th>Temporada</th><th class="tl">Equipo</th><th class="tl hm">Liga</th><th>PJ</th><th>Pts</th><th>Reb</th><th>Ast</th><th>${P.career[0].val != null ? 'Val' : 'Min'}</th></tr></thead>
    <tbody>${P.career.map((c) => `<tr class="${c.current ? 'cur' : ''}"><td>${c.season}</td><td class="tl">${c.team}</td><td class="tl hm"><span class="lgp">${c.league}</span></td><td>${c.gp}</td><td>${n1(c.pts)}</td><td>${n1(c.reb)}</td><td>${n1(c.ast)}</td><td>${n1(c.val ?? c.min)}</td></tr>`).join('')}</tbody></table></div>
  </section>
  <footer>${P.valCalc ? 'VAL*: valoración calculada con la fórmula europea; la NBA no la publica. ' : ''}Datos: ${P.league === 'NBA' ? 'ESPN' : 'acb.com'} · actualizado el 15 nov 2026.</footer>
</main>`
</script>
</body>
</html>
