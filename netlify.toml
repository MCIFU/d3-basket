# Versión web de D3 Basket en Netlify.
# En cada build se ejecuta el scraper (incremental gracias a la caché de la BD),
# se exportan los datos comprimidos y se compila la web estática.
[build]
  command = "npm run build:netlify"
  publish = "dist-web"

[build.environment]
  NODE_VERSION = "22"
  # Electron no hace falta en el servidor: evita descargar su binario.
  ELECTRON_SKIP_BINARY_DOWNLOAD = "1"

# Conserva data/d3basket.db entre builds para no volver a descargar todo cada vez.
[[plugins]]
  package = "/netlify/plugins/cache-db"

[functions]
  directory = "netlify/functions"

# Los datos cambian en cada build: el navegador siempre revalida.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# JS/CSS/wasm con hash en el nombre: caché larga.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
